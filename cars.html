<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse our premium fleet of rental cars.">
    <title>Our Fleet - Rentals</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">
                    <span>Rentals</span>
                </a>
                <ul class="nav-links">
                    <!-- Populated by app.js -->
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="cars-header">
            <h2>Select Your Vehicle</h2>
            
            <div class="search-bar">
                <input type="text" id="search-input" class="form-control" placeholder="Search by name or model...">
            </div>

            <div class="filters">
                <button class="btn btn-primary filter-btn" data-filter="All">All Cars</button>
                <button class="btn btn-secondary filter-btn" data-filter="Small">Small</button>
                <button class="btn btn-secondary filter-btn" data-filter="Medium">Medium</button>
                <button class="btn btn-secondary filter-btn" data-filter="SUV">SUV</button>
                <button class="btn btn-secondary filter-btn" data-filter="VAN">VAN</button>
            </div>
        </section>

        <!-- Dynamically populated via app.js -->
        <section class="cars-grid" id="cars-grid">
            <!-- Cards go here -->
        </section>
    </main>

    <footer>
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
            <p>&copy; 2026 Rentals Premium Car Hire. All rights reserved.</p>
            <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                <a href="terms.html" style="color: var(--text-muted); font-size: 0.875rem;">Terms of Use</a>
                <a href="privacy.html" style="color: var(--text-muted); font-size: 0.875rem;">Privacy Policy</a>
                <a href="contact.html" style="color: var(--text-muted); font-size: 0.875rem;">Contact Us</a>
            </div>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
