<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Your Car - Rentals</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo"><span>Rentals</span></a>
                <ul class="nav-links"></ul>
            </nav>
        </div>
    </header>
    <main class="container profile-section">
        <div style="text-align: center; margin-bottom: 3rem;">
            <h2>Earn Money With Your Car</h2>
            <p style="color: var(--text-muted);">List your car on our platform and earn money by giving it on rent.</p>
        </div>
        <div class="auth-card" style="max-width: 600px; margin: 0 auto;">
            <form>
                <div class="form-group">
                    <label>Car Make & Model</label>
                    <input type="text" class="form-control" placeholder="e.g. Maruti Suzuki Swift, Hyundai Creta" required>
                </div>
                <div class="form-group">
                    <label>Registration Year</label>
                    <input type="number" class="form-control" placeholder="e.g. 2022" required>
                </div>
                <div class="form-group">
                    <label>City / Location</label>
                    <input type="text" class="form-control" placeholder="e.g. Mumbai, Delhi, Bangalore" required>
                </div>
                <div class="form-group">
                    <label>Expected Daily Rent (₹)</label>
                    <input type="number" class="form-control" placeholder="e.g. 1500" required>
                </div>
                <div class="form-group">
                    <label>Your Phone Number</label>
                    <input type="tel" class="form-control" placeholder="10-digit mobile number" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block" onclick="alert('Your request has been submitted! Our team will contact you shortly to verify your car details.'); return false;">Submit Request</button>
            </form>
        </div>
    </main>
    <footer>
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
            <p>&copy; 2026 Rentals Premium Car Hire. All rights reserved.</p>
            <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                <a href="terms.html" style="color: var(--text-muted); font-size: 0.875rem;">Terms of Use</a>
                <a href="privacy.html" style="color: var(--text-muted); font-size: 0.875rem;">Privacy Policy</a>
                <a href="contact.html" style="color: var(--text-muted); font-size: 0.875rem;">Contact Us</a>
            </div>
        </div>
    </footer>
    <script src="js/app.js"></script>
</body>
</html>
