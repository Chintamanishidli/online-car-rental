<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="User profile and booking history.">
    <title>My Profile - Rentals</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">
                <span>Rentals</span>
                </a>
                <ul class="nav-links">
                    <!-- Populated by app.js -->
                </ul>
            </nav>
        </div>
    </header>

    <main class="container profile-section">
        <h2>My Account</h2>
        <br>
        
        <div class="profile-container">
            <!-- Sidebar -->
            <div class="profile-sidebar">
                <div class="profile-nav">
                    <div class="profile-nav-item active" id="nav-profile">👤 Contact Details</div>
                    <div class="profile-nav-item" id="nav-history">📅 Booking History</div>
                </div>
            </div>

            <!-- Content Area -->
            <div class="profile-content">
                
                <!-- Profile View -->
                <div id="view-profile">
                    <h3>Contact Details</h3>
                    <p style="color: var(--text-muted); margin-bottom: 2rem;">Update your personal information below.</p>
                    
                    <form id="profile-form">
                        <div style="display: flex; gap: 1rem;">
                            <div class="form-group" style="flex: 1;">
                                <label for="prof-name">Full Name</label>
                                <input type="text" id="prof-name" class="form-control" disabled style="opacity: 0.7;">
                            </div>
                            <div class="form-group" style="flex: 1;">
                                <label for="prof-email">Email Address</label>
                                <input type="email" id="prof-email" class="form-control" disabled style="opacity: 0.7;">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="prof-phone">Phone Number</label>
                            <input type="tel" id="prof-phone" class="form-control" placeholder="+1 (555) 000-0000">
                        </div>

                        <div class="form-group">
                            <label for="prof-address">Home Address</label>
                            <textarea id="prof-address" class="form-control" rows="3" placeholder="123 Main St, City, Country"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </form>
                </div>

                <!-- History View -->
                <div id="view-history" class="hidden">
                    <h3>Booking History</h3>
                    <p style="color: var(--text-muted); margin-bottom: 2rem;">View all your past and upcoming reservations.</p>
                    
                    <div id="history-container">
                        <!-- Populated by app.js -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
            <p>&copy; 2026 Rentals Premium Car Hire. All rights reserved.</p>
            <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                <a href="terms.html" style="color: var(--text-muted); font-size: 0.875rem;">Terms of Use</a>
                <a href="privacy.html" style="color: var(--text-muted); font-size: 0.875rem;">Privacy Policy</a>
                <a href="contact.html" style="color: var(--text-muted); font-size: 0.875rem;">Contact Us</a>
            </div>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
