<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Rentals</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo"><span>Rentals</span></a>
                <ul class="nav-links"></ul>
            </nav>
        </div>
    </header>
    <main class="container profile-section">
        <div style="text-align: center; margin-bottom: 3rem;">
            <h2>Contact Us</h2>
            <p style="color: var(--text-muted);">We'd love to hear from you. Please fill out the form below.</p>
        </div>
        <div class="auth-card" style="max-width: 600px; margin: 0 auto;">
            <form>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Your Message</label>
                    <textarea class="form-control" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-block" onclick="alert('Message sent successfully!'); return false;">Send Message</button>
            </form>
        </div>
    </main>
    <footer>
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
            <p>&copy; 2026 Rentals Premium Car Hire. All rights reserved.</p>
            <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                <a href="terms.html" style="color: var(--text-muted); font-size: 0.875rem;">Terms of Use</a>
                <a href="privacy.html" style="color: var(--text-muted); font-size: 0.875rem;">Privacy Policy</a>
                <a href="contact.html" style="color: var(--text-muted); font-size: 0.875rem;">Contact Us</a>
            </div>
        </div>
    </footer>
    <script src="js/app.js"></script>
</body>
</html>
